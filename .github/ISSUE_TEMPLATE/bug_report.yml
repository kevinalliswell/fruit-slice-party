name: Bug report
description: Report a reproducible problem in the game
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Fruit Slice Party.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Choose...
        3. Swipe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: iPadOS 20, Safari
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Add screenshots, console errors, or other useful context.
